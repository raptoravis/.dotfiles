[common.variables]
copy_command = "pbcopy"  # default/fallback
theme            = "tokyo-night"                # tokyo-night | catppuccin-macchiato | catppuccin-mocha | gruvbox-dark
theme_ghostty    = "TokyoNight"                # Tokyo Night | Catppuccin Macchiato | Catppuccin Mocha | GruvboxDark
theme_wezterm    = "Tokyo Night Storm (Gogh)"   # Tokyo Night Storm (Gogh) | Catppuccin Macchiato (Gogh) | Catppuccin Mocha (Gogh) | GruvboxDark

[common.files]
"common/linters" = "~/.config"
"common/cargo" = "~/.cargo"
"common/fastfetch" = "~/.config/fastfetch"
"common/mise" = "~/.config/mise"
"common/nvim" = "~/.config/nvim"
"common/starship" = "~/.config"
"common/zsh" = "~/.config/zsh"
"common/bash" = "~/.config/bash"
"common/tmux/tmux.conf" = "~/.tmux.conf"
"common/uv" = "~/.config/uv"
# NOTE: settings.json is intentionally NOT symlinked here. cc-switch owns
# ~/.claude/settings.json (it injects the env block — ANTHROPIC_BASE_URL /
# ANTHROPIC_AUTH_TOKEN — when switching providers). A dotter symlink would let
# cc-switch write the auth token through into this git repo and break on every
# provider switch. The repo's common/claude/settings.json is the shared *base*;
# sync it into cc-switch's common config manually (see install-* scripts).
"common/claude/statusline.mjs" = "~/.claude/statusline.mjs"
"common/claude/CLAUDE.md" = "~/.claude/CLAUDE.md"
"common/claude/RTK.md" = "~/.claude/RTK.md"
"common/claude/claude-hud-config.json" = "~/.claude/plugins/claude-hud/config.json"
"common/nushell" = "~/.config/nushell"
"common/wezterm/constants.lua" = "~/.config/wezterm/constants.lua"
"common/wezterm/functions.lua" = "~/.config/wezterm/functions.lua"
"common/wezterm/keybinds.lua" = "~/.config/wezterm/keybinds.lua"
"common/wezterm/wezterm.lua" = { target = "~/.config/wezterm/wezterm.lua", type = "template" }

[windows.files]
"windows/wsl/.wslconfig" = "~/.wslconfig"

[mac.files]
"common/bottom" = "~/Library/Application Support/bottom"
"macos/borders" = "~/.config/borders"
"macos/aerospace" = "~/.config/aerospace"
"macos/ghostty/config" = { target = "~/.config/ghostty/config", type = "template" }

[linux.files]
"common/bottom" = "~/.config/bottom"
"windows/wsl/.hushlogin" = "~/.hushlogin"
